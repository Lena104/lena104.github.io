baseURL = "https://myoheey.github.io/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
title = "AI 뉴스 다이제스트"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
paginate = 10

[minify]
disableXML = true
minifyOutput = true

# HTML 태그(<strong> 등)를 그대로 통과 — 한국어 옆 **굵게** 깨짐 우회용
[markup.goldmark.renderer]
unsafe = true

# CJK 줄바꿈 등 처리
[markup.goldmark.extensions.cjk]
enable = true
escapedSpace = true
eastAsianLineBreaks = true

[params]
env = "production"
title = "AI 뉴스 다이제스트"
description = "매일 아침, 국내외 AI 업계의 핵심 뉴스를 한국어로 정리합니다."
keywords = ["AI", "인공지능", "뉴스", "트렌드", "테크"]
author = "myoheey"
DateFormat = "2006-01-02"
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

[params.homeInfoParams]
Title = "안녕하세요"
Content = "매일 아침 국내외 AI 뉴스를 모아 한국어로 정리합니다. 글감, 트렌드 파악, 인사이트 정리에 활용해 보세요."

[[params.socialIcons]]
name = "github"
url = "https://github.com/myoheey"

[[params.socialIcons]]
name = "rss"
url = "index.xml"

[params.assets]
disableHLJS = false
favicon = ""

[params.label]
text = "AI 뉴스 다이제스트"

[outputs]
home = ["HTML", "RSS", "JSON"]

[[menu.main]]
identifier = "posts"
name = "글 목록"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "태그"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "archives"
name = "아카이브"
url = "/archives/"
weight = 30
